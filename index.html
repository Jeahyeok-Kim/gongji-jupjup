<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <script>
    /* 화면을 그리기 전에 테마를 정해서, 다크 모드 사용자가 흰 화면을 잠깐 보지 않게 한다 */
    (function () {
      var pref = 'auto', fs = 'md';
      try {
        var t = JSON.parse(localStorage.getItem('gongji:theme')); if (t === 'light' || t === 'dark') pref = t;
        var f = JSON.parse(localStorage.getItem('gongji:fontScale')); if (f === 'sm' || f === 'lg') fs = f;
      } catch (e) { /* 저장소를 못 쓰면 기기 설정을 따른다 */ }
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var el = document.documentElement;
      el.dataset.theme = dark ? 'dark' : 'light'; el.dataset.themePref = pref; el.dataset.fs = fs;
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? '#1a1d21' : '#ffffff';
    })();
  </script>
  <title>공지 줍줍</title>
  <meta name="description" content="건국대학교 GLOCAL캠퍼스 공지를 모아 내 시간표와 시간에 맞게 골라 주는 서비스">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/mark.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="공지 줍줍">
  <!-- 글꼴: Pretendard (받지 못하면 기기 글꼴로 보임) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 제목·숫자용 글꼴: 원티드 산스 (기업 브랜드 서체, OFL). 받지 못하면 Pretendard 로 보임 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="notices">
  <header class="topbar">
    <div class="brand">
      <svg class="mark brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M10.5 6.5h7.2l3.8 3.8v6.2H10.5z" fill="#fff"/><path d="M17.7 6.5v3.8h3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 17.2h4.6l1.6 2.6h4.6l1.6-2.6h4.6v5.6a2.6 2.6 0 0 1-2.6 2.6H10.1a2.6 2.6 0 0 1-2.6-2.6z" fill="#fff"/></svg>
      <div>
        <h1>공지 <em>줍줍</em></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <button type="button" class="cmdk" id="palette-btn" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" data-i18n-aria="palTitle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="cmdk-text" data-i18n="palShort"></span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <p class="today"><span data-i18n="today"></span> <strong class="today-text"></strong></p>
      <label class="lang-select">
        <span data-i18n="language"></span>
        <select id="lang" class="lang-control" translate="no"></select>
      </label>
      <button type="button" class="icon-btn" id="alerts-btn" aria-haspopup="dialog" data-i18n-aria="alertsTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4zM10 20a2 2 0 0 0 4 0"/></svg>
        <span class="icon-badge" id="alerts-badge" hidden></span>
      </button>
      <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <p class="sync-bar" id="sync-bar" hidden>
    <span id="sync-text" aria-live="polite"></span>
    <button type="button" class="link-btn" id="sync-btn" data-i18n="syncRefresh"></button>
  </p>

  <p class="notice-banner" id="notice-banner" hidden role="status">
    <span id="notice-banner-text"></span>
    <button type="button" class="link-btn" id="notice-banner-close" data-i18n="close"></button>
  </p>

  <p class="banner" id="sample-banner" hidden><span data-i18n="sampleBanner"></span></p>

  <!-- 오늘 (PC: 목록 위 한 줄 요약 / 휴대폰: '오늘' 탭) -->
  <section class="home" id="home" data-view="home" aria-labelledby="home-title">
    <div class="masthead">
    <div class="masthead-in">
    <div class="home-head">
      <div class="hero">
        <p class="hero-date" id="home-date"></p>
        <h2 id="home-title"></h2>
      </div>
      <button type="button" class="link-btn home-toggle" id="home-toggle" aria-expanded="true"></button>
    </div>
    <!-- 공지에게 묻기: 질문을 조건으로 풀어 찾고, 내 컴퓨터 서버로 열었으면 로컬 AI가 답을 씀 -->
    <section class="ask" id="ask" aria-labelledby="ask-title">
      <h3 id="ask-title" class="ask-title" data-i18n="askTitle"></h3>
      <form class="ask-form" id="ask-form" role="search">
        <input type="search" id="ask-q" autocomplete="off" enterkeyhint="search" maxlength="120" data-i18n-placeholder="askPlaceholder">
        <button type="submit" class="btn primary" data-i18n="askBtn"></button>
      </form>
      <div class="ask-examples" id="ask-examples"></div>
    </section>
    </div>
    </div>
    <div class="home-wrap">
      <div id="ask-result" aria-live="polite"></div>
      <div id="home-body"></div>
    </div>
  </section>

  <main class="layout">
    <!-- 공지 목록 (휴대폰: '공지' 탭) -->
    <section class="content" data-view="notices" aria-labelledby="list-heading">
      <div class="view-head">
        <h2 id="list-heading" data-i18n="tabNotices"></h2>
        <p class="view-sub" data-i18n="viewNoticesSub"></p>
        <div class="view-switch" role="tablist" data-i18n-aria="nviewLabel"></div>
      </div>

      <div class="toolbar">
        <label class="search">
          <span class="visually-hidden" data-i18n="searchLabel"></span>
          <input type="search" id="q" autocomplete="off" enterkeyhint="search" list="recent-list" data-i18n-placeholder="searchPlaceholder">
          <kbd class="search-key" aria-hidden="true">/</kbd>
          <datalist id="recent-list"></datalist>
        </label>
        <button type="button" class="btn filter-toggle" id="filter-toggle" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></svg>
          <span data-i18n="filterToggle"></span><span class="ft-count" hidden></span>
        </button>
        <label class="field">
          <span data-i18n="board"></span>
          <select id="board"></select>
        </label>
        <label class="field">
          <span data-i18n="field"></span>
          <select id="field"></select>
        </label>
        <label class="field">
          <span data-i18n="status"></span>
          <select id="status">
            <option value="open" data-i18n="statusOpen"></option>
            <option value="week" data-i18n="statusWeek"></option>
            <option value="all" data-i18n="statusAll"></option>
            <option value="past" data-i18n="statusPast"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="sort"></span>
          <select id="sort">
            <option value="deadline" data-i18n="sortDeadline"></option>
            <option value="latest" data-i18n="sortLatest"></option>
            <option value="benefit" data-i18n="sortBenefit"></option>
            <option value="hours" data-i18n="sortHours"></option>
            <option value="hits" data-i18n="sortHits"></option>
          </select>
        </label>
      </div>

      <div class="chips" id="chips" role="group" data-i18n-aria="kindFilter"></div>
      <div class="chips subchips" id="subchips" role="group" data-i18n-aria="subKindFilter" hidden></div>

      <p class="due-note" id="due-note" hidden></p>

      <div class="list-head">
        <p id="count" aria-live="polite"></p>
        <div class="list-tools">
          <button type="button" class="link-btn" id="reset-filters" hidden data-i18n="resetFilters"></button>
          <label class="toggle">
            <input type="checkbox" id="saved-only">
            <span id="saved-only-label"></span>
          </label>
          <label class="toggle" id="mine-only-wrap" hidden>
            <input type="checkbox" id="mine-only">
            <span data-i18n="mineOnly"></span>
          </label>
          <label class="toggle" id="fit-only-wrap" hidden>
            <input type="checkbox" id="fit-only">
            <span data-i18n="fitOnly"></span>
          </label>
          <button type="button" class="link-btn fit-setup" id="fit-setup" hidden data-i18n="fitSetup"></button>
          <label class="toggle">
            <input type="checkbox" id="unread-only">
            <span data-i18n="unreadOnly"></span>
          </label>
          <label class="toggle">
            <input type="checkbox" class="group-control">
            <span data-i18n="groupView"></span>
          </label>
        </div>
      </div>

      <div id="list"></div>
    </section>

    <!-- 지원 보드: 저장한 공지를 관심 → 준비 중 → 지원 완료 → 결과로 끌어 옮긴다 -->
    <section class="board-view" data-view="track" aria-labelledby="board-title">
      <div class="view-head">
        <h2 id="board-title" data-i18n="boardTitle"></h2>
        <p class="view-sub"><span data-i18n="boardHelp"></span> <strong id="board-sum"></strong></p>
      </div>
      <div class="board" id="kanban"></div>
    </section>

    <aside class="side">
      <!-- 내 시간표 (휴대폰: '시간표' 탭) -->
      <section class="panel" id="timetable-panel" data-view="timetable" data-sub="week" aria-labelledby="tt-title">
        <!-- 이번 학기 시간표 · 이수 내역(지금까지 들은 과목) · 수강신청 추천 -->
        <div class="tt-sub" id="tt-sub" role="tablist" data-i18n-aria="planTabsLabel">
          <button type="button" role="tab" data-sub="week" data-i18n="planTabWeek" aria-selected="true"></button>
          <button type="button" role="tab" data-sub="history" data-i18n="planTabHistory" aria-selected="false"></button>
          <button type="button" role="tab" data-sub="plan" data-i18n="planTabPlan" aria-selected="false"></button>
        </div>
        <div class="panel-head">
          <h2 id="tt-title" data-i18n="timetable"></h2>
          <button type="button" class="btn primary small" id="add-class-btn" data-i18n="addClass"></button>
        </div>
        <p class="help" data-i18n="timetableHelp"></p>
        <!-- 에브리타임처럼 요일×시간 격자. 빈 칸을 누르면 그 시간으로 수업 추가, 수업을 누르면 수정 -->
        <div class="tt" id="tt"></div>
        <div class="calendar" id="calendar" hidden></div>
        <div class="row">
          <button type="button" class="btn" id="example-tt" data-i18n="exampleTimetable"></button>
          <button type="button" class="btn" id="clear-tt" data-i18n="clearTimetable"></button>
          <button type="button" class="btn" id="tt-image" data-i18n="ttImage"></button>
        </div>
        <label class="toggle">
          <input type="checkbox" class="hide-control">
          <span data-i18n="hideConflicts"></span>
        </label>
        <!-- 내 학과 교육과정: 학과를 고르면 요람의 과목이 학년별로 나오고, 누르면 수업 추가 창에 이름이 들어감 -->
        <details class="curr" id="curr">
          <summary data-i18n="currTitle"></summary>
          <div class="curr-body" id="curr-body"></div>
        </details>
        <div class="sub-view" id="history-view" role="tabpanel" hidden></div>
        <div class="sub-view" id="plan-view" role="tabpanel" hidden></div>
      </section>

      <!-- 시간 예산 추천 (휴대폰: '추천' 탭) -->
      <div class="view-head budget-head" data-view="budget">
        <h2 data-i18n="tabNotices"></h2>
        <p class="view-sub" data-i18n="viewNoticesSub"></p>
        <div class="view-switch" role="tablist" data-i18n-aria="nviewLabel"></div>
      </div>
      <section class="panel" id="budget-panel" data-view="budget" aria-labelledby="budget-title">
        <h2 id="budget-title" data-i18n="budget"></h2>
        <p class="help" data-i18n="budgetHelp"></p>
        <form id="budget-form" class="budget-form">
          <label>
            <span data-i18n="budgetHours"></span>
            <input type="number" id="budget-hours" min="0.5" max="40" step="0.5" value="4" inputmode="decimal" required>
          </label>
          <label>
            <span data-i18n="budgetWindow"></span>
            <select id="budget-window">
              <option value="7" data-i18n="window7"></option>
              <option value="14" data-i18n="window14"></option>
              <option value="30" data-i18n="window30"></option>
            </select>
          </label>
          <label class="toggle wide">
            <input type="checkbox" id="budget-selective">
            <span data-i18n="selectiveInclude"></span>
          </label>
          <button type="submit" class="btn primary wide" data-i18n="recommend"></button>
        </form>
        <div class="budget-presets" id="budget-presets" role="group"></div>
        <div id="budget-result" aria-live="polite"></div>
        <p class="fine" data-i18n="scoreRule"></p>
      </section>

      <!-- 설정 (휴대폰 전용: '설정' 탭) -->
      <section class="panel settings-panel" id="settings-panel" data-view="settings" aria-labelledby="settings-title">
        <h2 id="settings-title" data-i18n="settings"></h2>
        <label class="setting-row">
          <span data-i18n="language"></span>
          <select class="lang-control" id="lang-m" translate="no"></select>
        </label>
        <p class="setting-row"><span data-i18n="today"></span> <strong class="today-text"></strong></p>
        <label class="toggle setting-row">
          <input type="checkbox" class="group-control">
          <span data-i18n="groupView"></span>
        </label>
        <label class="toggle setting-row">
          <input type="checkbox" class="hide-control">
          <span data-i18n="hideConflicts"></span>
        </label>
        <div class="btn-row setting-row">
          <button type="button" class="btn small" id="show-guide" data-i18n="showGuide"></button>
          <button type="button" class="btn small" id="export-saved-cal"></button>
        </div>
        <p class="fine kbd-help" data-i18n="kbdHelp"></p>
        <div class="install-box setting-row" id="install-box" hidden>
          <button type="button" class="btn small primary" id="install-btn" data-i18n="installApp"></button>
          <p class="fine" id="install-hint"></p>
        </div>
        <p class="fine setting-row" id="ov-status" hidden></p>
        <p class="help" data-i18n="about"></p>
        <p class="fine"><span data-i18n="footerNote"></span> <span class="data-info"></span></p>
        <p class="fine" data-i18n="footer"></p>
      </section>

      <!-- 나에게 맞게: 화면 모드·글자 크기·관심·알림·구글 캘린더 (PC: 항상 보임 / 휴대폰: '설정' 탭) -->
      <section class="panel my-panel" id="my-panel" data-view="settings" aria-labelledby="my-title">
        <h2 id="my-title" data-i18n="myTitle"></h2>
        <div id="my-body"></div>
      </section>

      <!-- 내 설정 백업 (PC: 항상 보임 / 휴대폰: '설정' 탭) -->
      <section class="panel mydata-panel" data-view="settings" aria-labelledby="mydata-title">
        <h2 id="mydata-title" data-i18n="backupTitle"></h2>
        <p class="help" data-i18n="backupHelp"></p>
        <div class="btn-row">
          <button type="button" class="btn small" id="export-mine" data-i18n="exportMine"></button>
          <label class="btn small file-btn"><span data-i18n="importMine"></span>
            <input type="file" id="import-mine" accept="application/json,.json" hidden></label>
        </div>
        <p class="fine" id="backup-msg" aria-live="polite"></p>
      </section>
    </aside>
  </main>

  <!-- 휴대폰 아래 탭 -->
  <nav class="tabbar" data-i18n-aria="tabsLabel">
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9M10 19v-5h4v5"/></svg>
      <span data-i18n="tabHome"></span>
      <span class="tab-badge" id="badge-home" hidden></span>
    </a>
    <a href="#/notices" data-tab="notices">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
      <span data-i18n="tabNotices"></span>
    </a>
    <a href="#/track" data-tab="track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="5" height="15" rx="1.5"/><rect x="9.5" y="4.5" width="5" height="10" rx="1.5"/><rect x="15.5" y="4.5" width="5" height="12.5" rx="1.5"/></svg>
      <span data-i18n="tabTrack"></span>
      <span class="tab-badge" id="badge-track" hidden></span>
    </a>
    <a href="#/timetable" data-tab="timetable">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg>
      <span data-i18n="tabTimetable"></span>
      <span class="tab-badge" id="badge-timetable" hidden></span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></svg>
      <span data-i18n="tabSettings"></span>
    </a>
  </nav>

  <dialog id="detail" aria-labelledby="detail-title" closedby="any">
    <div class="detail-nav" id="detail-nav" hidden></div>
    <div class="dialog-body" id="detail-body"></div>
    <form method="dialog" class="dialog-actions detail-actions">
      <span class="detail-foot" id="detail-foot"></span>
      <button class="btn" value="close" data-i18n="close"></button>
    </form>
  </dialog>

  <!-- 수업 넣기·고치기 (휴대폰에서는 아래에서 올라오는 시트) -->
  <dialog id="class-dialog" aria-labelledby="class-dialog-title" closedby="any">
    <form id="class-form" class="dialog-body class-form" novalidate>
      <h2 id="class-dialog-title"></h2>
      <label class="wide">
        <span data-i18n="className"></span>
        <input type="text" name="name" id="class-name" maxlength="30" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="course-suggest" data-i18n-placeholder="classPlaceholder">
      </label>
      <ul class="wide course-suggest" id="course-suggest" role="listbox" hidden></ul>
      <p class="wide fine class-extra" id="class-extra" hidden></p>
      <fieldset class="wide day-field">
        <legend><span data-i18n="day"></span> <span class="day-hint" data-i18n="daysHint"></span></legend>
        <div class="day-picks" id="class-days"></div>
      </fieldset>
      <div class="wide time-field">
        <span class="time-label" id="start-label" data-i18n="start"></span>
        <select id="start-h" aria-labelledby="start-label"></select><span aria-hidden="true">:</span><select id="start-m" aria-labelledby="start-label"></select>
      </div>
      <div class="wide time-field">
        <span class="time-label" id="end-label" data-i18n="end"></span>
        <select id="end-h" aria-labelledby="end-label"></select><span aria-hidden="true">:</span><select id="end-m" aria-labelledby="end-label"></select>
      </div>
      <div class="wide durations">
        <span class="time-label" data-i18n="duration"></span>
        <div class="duration-picks" id="durations"></div>
      </div>
      <p id="class-error" class="error-msg wide" role="alert"></p>
    </form>
    <div class="dialog-actions class-actions">
      <button type="button" class="btn danger" id="class-delete" hidden data-i18n="remove"></button>
      <button type="button" class="btn" id="class-more" data-i18n="saveMore"></button>
      <button type="button" class="btn" id="class-cancel" data-i18n="cancel"></button>
      <button type="submit" form="class-form" class="btn primary" data-i18n="save"></button>
    </div>
  </dialog>

  <!-- 처음 열었을 때 사용 안내 -->
  <dialog id="welcome" aria-labelledby="welcome-title" closedby="none">
    <div class="dialog-body welcome-body" id="welcome-body"></div>
    <div class="dialog-actions welcome-actions">
      <button type="button" class="btn" id="welcome-example"></button>
      <button type="button" class="btn primary" id="welcome-start" autofocus></button>
    </div>
  </dialog>

  <!-- 알림 센터 -->
  <dialog id="alerts" aria-labelledby="alerts-title" closedby="any">
    <div class="dialog-body" id="alerts-body"></div>
    <form method="dialog" class="dialog-actions">
      <button class="btn primary" value="close" data-i18n="close"></button>
    </form>
  </dialog>

  <!-- 데이터 불러오기 (처음 열었을 때·공지가 비었을 때) -->
  <div class="boot" id="boot" role="status" aria-live="polite" hidden>
    <div class="boot-card" id="boot-card"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" class="toast-action" id="toast-action" hidden></button>
  </div>

  <button type="button" class="to-top" id="to-top" hidden data-i18n-aria="toTop">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
  </button>

  <footer class="footer">
    <p data-i18n="footer"></p>
    <p class="fine"><span data-i18n="footerNote"></span> <span class="data-info"></span></p>
  </footer>
